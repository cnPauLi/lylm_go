<!DOCTYPE HTML>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
    <title>{{ .Cfg "title" }}</title>
	<meta name="keywords" content="{{ .Cfg "keywords" }}">
	<meta name="description" content="{{ .Cfg "description" }}">
	<link rel="icon" href="{{ .Cfg "logo" }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ .Cdn }}/template/page/css/main.css">
    <style>#bg:after {background-image: url("{{ css .BackgroundImg }}");}</style>
</head>
<body>
<div id="wrapper">
	<header id="header">
	    <div class="logo">
		    <img src="{{ .Cfg "logo" }}" class="logo">
	    </div>
	    <div class="content">
		    <div class="inner">
			    {{ raw (.ThemeCfg "home_title" "") }}
		    </div>
	    </div>
	    <nav>
	        <ul>
{{ range .Tags }}
        <li><a href="{{ .TagLink }}"{{ if eq .TagTarget 1 }} target="_blank"{{ end }}>{{ .TagName }}</a></li>
 {{ end }}
	        </ul>
	    </nav>
	</header>
	<footer id="footer">
		 
	<p class="copyright">
	 <!--备案信息-->
	 {{ if .Cfg "icp" }}<p><a href="http://beian.miit.gov.cn/"  class="icp nav-link" target="_blank" _mstmutation="1" _istranslated="1">{{ .Cfg "icp" }}</a></p>{{ end }}	
	{{ raw (.Cfg "copyright") }}</p>
	</footer>
</div>
<div id="bg">
</div>
</body>
</html>

{
    "author_name": "六零",
    "author_link": "https://github.com/lylme",
    "theme_name": "DevTheme",
    "theme_version": "1.0.0",
    "theme_explain": "六零导航页官方开发包",
    "theme_demo": "https://spage.lylme.com/theme/dev-theme",
    "requires": ">=1.2.5",
    "updated_at": "2026-08-29",
    "license": "MIT",
    "theme_config": [
        {
            "type": "color",
            "name": "color",
            "title": "主题主色",
            "description": "用于搜索按钮、链接悬停等主色调，留空则使用默认蓝色",
            "value": "#2f6fed"
        },
        {
            "type": "select",
            "name": "link_cols",
            "title": "列表列数",
            "description": "每行显示的链接数量，手机端会自动变为 2 列",
            "value": "4",
            "enum": [
                ["3", "3 列"],
                ["4", "4 列"],
                ["5", "5 列"],
                ["6", "6 列"]
            ]
        },
        {
            "type": "checkbox",
            "name": "modules",
            "title": "首页显示模块",
            "description": "可多选，取消勾选后对应模块不再显示",
            "value": ["clock"],
            "enum": [
                ["clock", "时间显示"]
            ]
        },
        {
            "type": "textarea",
            "name": "notice",
            "title": "首页公告",
            "description": "显示在搜索框下方，<code>支持 HTML 代码</code>，留空不显示",
            "value": ""
        },
        {
            "type": "text",
            "name": "gonganbei",
            "title": "公安备案号",
            "description": "公安备案号，留空不显示",
            "value": "",
            "placeholder": "京公安网备xxxxxxxxxx号"
        }
    ]
}

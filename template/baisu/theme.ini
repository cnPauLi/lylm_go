{
    "author_name": "BaiSu",
    "author_link": "https://gitee.com/baisucode/baisu-two",
    "theme_name": "BaiSu",
    "theme_version": "2.0",
    "theme_explain": "Onenav主题 六零二开",
    "theme_demo": "https://spage.lylme.com/theme/baisu",
    "theme_config": [
        {
            "type": "radio",
            "name": "link_desc",
            "title": "链接描述",
            "value": "1",
            "enum": [
                ["1", "显示"],
                ["2", "隐藏"]
            ]
        },
        {
            "type": "select",
            "name": "background",
            "title": "背景显示",
            "description": "背景图片显示位置",
            "value": "2",
            "enum": [
                ["0", "关闭"],
                ["1", "主体区域"],
                ["2", "时间区域"]
            ]
        },
        {
            "type": "select",
            "name": "lytoday",
            "title": "今日热榜",
            "description": "LyToday-JS插件显示位置，每日免费请求上限200次<a href=\"https://doc.lylme.com/spage/#/lytoday-js\" target=\"_blank\">查看文档</a>",
            "value": "0",
            "enum": [
                ["0", "关闭"],
                ["1", "搜索栏下方"],
                ["2", "底部"]
            ]
        },
        {
            "type": "textarea",
            "name": "lytodaycode",
            "title": "今日热榜代码",
            "description": "LyToday-JS插件自定义代码，若不了解请勿修改 <a href=\"https://doc.lylme.com/spage/#/lytoday-js\" target=\"_blank\">查看文档</a>",
            "value": "<div id=\"lytoday\"></div><script src=\"https://lytoday.lylme.com/\"></script>"
        },
        {
            "type": "radio",
            "name": "logo_show",
            "title": "显示LOGO",
            "value": "1",
            "enum": [
                ["1", "显示"],
                ["2", "隐藏"]
            ]
        },
        {
            "type": "text",
            "name": "gonganbei",
            "title": "公安备案号",
            "description": "公安备案号，留空不显示",
            "value": "",
            "placeholder": "京公安网备xxxxxxxxxx号"
        }
    ]
}

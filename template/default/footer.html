<script src="{{ .Cdn }}/assets/js/bootstrap.min.js" type="application/javascript"></script>
<script src="{{ .TemplatePath }}/js/script.js?v=20260826"></script>
<script src="{{ .Cdn }}/assets/js/icon.js"></script>
<div style="display:none;" class="back-to" id="toolBackTop">
    <a title="返回顶部" onclick="window.scrollTo(0,0);return false;" href="#top" class="back-top"></a>
</div>
<div class="mt-5 mb-3 footer text-muted text-center">
    <!--备案信息-->
    {{ $gab := .ThemeCfg "gonganbei" "" }}{{ if $gab }}<a class="icp" href="http://www.beian.gov.cn/portal/registerSystemInfo?recordcode={{ digits $gab }}" target="_blank" rel="nofollow noopener">
    <img src="/assets/img/icp.png" alt="公安网备" width="16" height="16">{{ $gab }} </a>{{ end }}
    {{ if .Cfg "icp" }}<a href="http://beian.miit.gov.cn/" class="icp" target="_blank" _mstmutation="1" _istranslated="1">{{ .Cfg "icp" }}</a>{{ end }}
    <!--版权信息-->
    <p> {{ raw (.Cfg "copyright") }}</p>
    <!--网站统计-->
    {{ if .Cfg "wztj" }}{{ raw (.Cfg "wztj") }}{{ end }}
</div>

</html>

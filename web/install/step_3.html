<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <title>六零导航页安装向导 - 安装成功</title>
    <link href="templates/style/install.css" type="text/css" rel="stylesheet"/>
    <script type="text/javascript" src="templates/js/jquery.min.js"></script>
</head>
<body>
<div class="header"></div>
<div class="mainBody">
    <div class="note">
        <div class="complete"><strong>现在您可以：</strong><br/>
            <div class="installed">
                <a href="../" target="_blank">访问首页</a><span>或</span><a class="admin" target="_blank" href="../{{ .AdminPath }}">登录后台</a>
            </div>
        </div>
        <table class="install-table">
            <caption>六零导航页安装信息</caption>
            <tr>
                <th>前台地址</th>
                <td><a href="../">{{ .SiteURL }}</a></td>
            </tr>
            <tr>
                <th>后台地址</th>
                <td><a href="../{{ .AdminPath }}">{{ .AdminURL }}</a></td>
            </tr>
            <tr>
                <th>后台账号</th>
                <td>{{ .AdminUser }}</td>
            </tr>
            <tr>
                <th>后台密码</th>
                <td>{{ .AdminPwd }}</td>
            </tr>
        </table>
        <p>您可以访问 <a href="https://doc.lylme.com/spage/#/readme" target="_blank" class="link">帮助文档</a> 获取更多帮助</p>
    </div>
</div>
<div class="footer"><span class="step4"></span> <span class="copyright">{{ .Copyright }}</span></div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>后台登录 - {{.TitleFirst}}</title>
  <link href="../assets/admin/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/admin/css/materialdesignicons.min.css" rel="stylesheet">
  <link href="../assets/admin/css/style.min.css" rel="stylesheet">
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background-color: #eef2f7;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .login-center {
      background: #fff;
      width: 100%;
      max-width: 27.5rem;
      padding: 2.5rem 2rem;
      border-radius: 1.25rem;
      box-shadow: 0 20px 60px rgba(30, 41, 59, 0.18);
      position: relative;
      overflow: hidden;
    }
    .login-center:before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #3b82f6, #60a5fa, #2563eb);
    }

    .login-header {
      margin-bottom: 1.5rem !important;
    }
    .login-header h2 {
      color: #1e293b;
      font-weight: 700;
    }

    .login-center .has-feedback.feedback-left .form-control {
      padding-left: 38px;
      padding-right: 12px;
    }

    .login-center .has-feedback.feedback-left .form-control-feedback {
      left: 0;
      right: auto;
      width: 38px;
      height: 38px;
      line-height: 38px;
      z-index: 4;
      color: #dcdcdc;
    }

    .login-center .captcha-row {
      position: relative;
    }

    .login-center .captcha-row .form-control {
      padding-right: 112px;
    }

    .login-center .captcha-row .captcha-img {
      position: absolute;
      top: 0;
      right: 0;
      height: 38px;
      width: 100px;
      object-fit: cover;
      border-radius: 3px;
      cursor: pointer;
      z-index: 5;
    }

    @media (max-width: 480px) {
      .login-page {
        padding: 0.75rem;
      }
      .login-center {
        padding: 2rem 1.25rem;
        border-radius: 1rem;
      }
    }
  </style>
</head>

<body>
  <div class="login-page"{{if .Page.Background}} style="background-image:url({{.Page.Background}})"{{end}}>
    <div class="login-center">
      <div class="login-header text-center">
        <h2>后台登录</h2>
      </div>
      <form action="" method="post">
        {{if .Page.IsLocked}}
          <div class="alert alert-warning" role="alert">
            <i class="mdi mdi-clock-alert mdi-alert-icon"></i>登录尝试次数过多，账号已临时锁定，请 {{.Page.LockMinutes}} 分钟后再试。
          </div>
        {{else if .Page.LoginError}}
          <div class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="mdi mdi-alert-circle mdi-alert-icon"></i>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            {{.Page.LoginError}}
          </div>
        {{end}}
        <div class="form-group has-feedback feedback-left mb-3">
          <input type="text" placeholder="用户名" class="form-control" name="user" id="username" autocomplete="username" value="{{.Page.LoginUser}}" />
          <span class="mdi mdi-account form-control-feedback" aria-hidden="true"></span>
        </div>
        <div class="form-group has-feedback feedback-left mb-3">
          <input type="password" placeholder="密码" class="form-control" id="password" name="pass" autocomplete="current-password" value="" />
          <span class="mdi mdi-lock form-control-feedback" aria-hidden="true"></span>
        </div>

        {{if .Page.NeedCaptcha}}
          <div class="form-group has-feedback feedback-left captcha-row mb-3">
            <input type="text" name="authcode" autocomplete="off" class="form-control" placeholder="验证码" required>
            <span class="mdi mdi-check form-control-feedback" aria-hidden="true"></span>
            <img id="captcha_img" title="验证码" src='../include/validatecode' class="captcha-img" onclick="recode()" />
          </div>
        {{end}}
        <div class="form-group mb-0">
          <button class="btn btn-primary w-100" type="submit" id="login">登录</button>
        </div>
        {{if .Page.NeedCaptcha}}
          <p class="m-b-0 text-end mt-3"><a target="_blank" title="忘记后台密码" href="https://doc.lylme.com/spage/#/reset">忘记密码</a></p>
        {{end}}
      </form>
      <hr class="my-4">
      <footer class="text-center">
        <p class="m-b-0">Copyright {{year}} <a href="/">{{.TitleFirst}}</a></p>
      </footer>
    </div>
  </div>
  <script type="text/javascript" src="../assets/admin/js/jquery.min.js"></script>
  <script type="text/javascript" src="../assets/admin/js/bootstrap.bundle.min.js"></script>
  <script>
    $(document).ready(function() {
      if ($('#captcha_img').length) {
        recode()
      }
    });

    function recode() {
      $('#captcha_img').attr('src', '../include/validatecode?r=' + Math.random());
      $("input[name='authcode']").val('');
    }
  </script>
</body>

</html>
